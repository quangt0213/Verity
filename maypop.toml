# Maypop app manifest. Verity's challenge deployment is GitHub -> Maypop web
# import/build; the Maypop CLI (`maypop init` / `maypop app apply` /
# `maypop publish`) is optional. Keep this file until it is confirmed whether
# the GitHub importer reads it.
[app]
name = "Verity"
description = "What's actually happening around you, and the evidence behind it."
visibility = "private"
link_access = "request"
# The repository also holds non-frontend code (shared contracts, and later the
# Verity service source). No secrets live in Git, but keep source sharing off.
allow_remixing = false
tags = ["local", "community", "maps"]

# Only the static frontend in apps/web is built. Its public VITE_* values must
# be present at build time: from the build environment (GitHub-imported
# builds), or apps/web/.env.production.local for a local `maypop publish`.
[build]
framework = "vite"
command = ["npm", "run", "build:web"]
output = "apps/web/dist"
entry = "index.html"
